<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>OHLC Support/Resistance</title>
  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: system-ui; max-width: 400px; margin: 20px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
    button { margin-top: 20px; width: 100%; padding: 12px; font-size: 18px; background: #007aff; color: white; border: none; border-radius: 8px; }
    .result { margin-top: 24px; }
    .level { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ccc; }
    .level:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <h2>OHLC Levels Calculator</h2>
  <label>Open (O)</label>
  <input type="number" id="open" placeholder="e.g. 100.50">
  <label>High (H)</label>
  <input type="number" id="high" placeholder="e.g. 105.20">
  <label>Low (L)</label>
  <input type="number" id="low" placeholder="e.g. 99.80">
  <label>Close (C)</label>
  <input type="number" id="close" placeholder="e.g. 103.00">

  <button onclick="calculateLevels()">Calculate</button>

  <div class="result" id="resultContainer" style="display:none;">
    <div class="level"><span>Highest Resistance</span><strong id="r3"></strong></div>
    <div class="level"><span>Higher Resistance</span><strong id="r2"></strong></div>
    <div class="level"><span>High Resistance</span><strong id="r1"></strong></div>
    <div class="level"><span>Low Support</span><strong id="s1"></strong></div>
    <div class="level"><span>Lower Support</span><strong id="s2"></strong></div>
    <div class="level"><span>Lowest Support</span><strong id="s3"></strong></div>
  </div>

  <script>
    function calculateLevels() {
      // Get input values
      const O = parseFloat(document.getElementById('open').value);
      const H = parseFloat(document.getElementById('high').value);
      const L = parseFloat(document.getElementById('low').value);
      const C = parseFloat(document.getElementById('close').value);

      // ---- REPLACE THIS WITH YOUR OWN FORMULA ----
      // Example: classic floor pivot points
      const PP = (R1+S1)/2;
      const R1 = IF(C>O,ROUNDDOWN((((H+L)/2)+((H-((H-L)/2))*(1-39%)),0),IF(C<O,ROUNDDOWN(((H+L)/2)+((H-((H+L)/2))*(1-37%)),0),0));
      const R2 = IF(C>O,ROUNDDOWN((((H+L)/2)+((H-L)*(1-42.5%)),0),IF(C<O,ROUNDDOWN(((H+L)/2+((H-L)*(1-42.5%)),0),0));
      const R3 = IF(C>O,ROUNDDOWN((((H+L)/2)+((H-L)*(1-19.3%)),0),IF(C<O,ROUNDDOWN(((H+L)/2+((H-L)*(1-18.5%)),0),0));
      const S1 = IF(C>O,ROUNDDOWN((((H+L)/2)-((H-((H-L)/2))*(1-39%)),0),IF(C<O,ROUNDDOWN(((H+L)/2)-((H-((H+L)/2))*(1-37%)),0),0));
      const S2 = IF(C>O,ROUNDDOWN((((H+L)/2)-((H-L)*(1-42.5%)),0),IF(C<O,ROUNDDOWN(((H+L)/2-((H-L)*(1-42.5%)),0),0));
      const S3 = IF(C>O,ROUNDDOWN((((H+L)/2)-((H-L)*(1-19.3%)),0),IF(C<O,ROUNDDOWN(((H+L)/2-((H-L)*(1-18.5%)),0),0));
      // -------------------------------------------

      // Display results (rounded to 2 decimals)
      document.getElementById('r3').textContent = R3.toFixed(2);
      document.getElementById('r2').textContent = R2.toFixed(2);
      document.getElementById('r1').textContent = R1.toFixed(2);
      document.getElementById('s1').textContent = S1.toFixed(2);
      document.getElementById('s2').textContent = S2.toFixed(2);
      document.getElementById('s3').textContent = S3.toFixed(2);

      document.getElementById('resultContainer').style.display = 'block';
    }
  </script>
</body>
</html>
